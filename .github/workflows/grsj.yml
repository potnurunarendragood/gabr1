name: firs-project
on: workflow_dispatch

jobs:
   build-test:
      runs-on: ubuntu-24.04
      steps:
         - name: checkout
           uses: actions/checkout@v4
      
         - name: build
           run: npm install
      
         - name: test
           run: npm test

         - name: artifact
           run:  actions/upload-artifact@v7
           with:
              name: artifact-1
              path: |
                 package*
         - name: deploy
           run: echo "application deployed"
           

                
           
